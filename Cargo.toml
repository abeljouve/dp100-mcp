[workspace]
resolver = "3"
members = ["crates/dp100-proto", "crates/dp100", "crates/dp100-mcp", "crates/dp100ctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abeljouve/dp100-mcp"

[workspace.dependencies]
dp100-proto = { path = "crates/dp100-proto" }
dp100 = { path = "crates/dp100" }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
